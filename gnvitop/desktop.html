<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gnvitop</title><meta name="theme-color" content="#0f172a">
<link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.json">
<style nonce="__NONCE__">
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f172a;color:#f1f5f9;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;min-height:80px;padding:16px 24px;border-bottom:1px solid #334155;background:#111d31;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:750;letter-spacing:-.6px}.brand img{width:34px;height:34px}
.status{font-size:13px;border-radius:20px;padding:7px 12px;color:#94a3b8;background:#1e293b}.status.live{color:#86efac;background:#12352c}
.spacer{flex:1}.note{font-size:12px;color:#94a3b8}button{border:1px solid #475569;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;color:#e2e8f0;background:#26354b;cursor:pointer}
button:hover{filter:brightness(1.15)}button:focus-visible,a:focus-visible{outline:3px solid #7dd3fc;outline-offset:3px}button:disabled{opacity:.55;cursor:wait}
.start{background:#38bdf8;border-color:#38bdf8;color:#082f49}.stop{border-color:#9f4747;background:#3b222b;color:#fecaca}
main{position:relative;flex:1;min-height:0;display:flex}iframe{width:100%;height:100%;border:0;display:block}#empty{margin:auto;max-width:610px;text-align:center;padding:50px 25px}
.symbol{width:76px;height:76px;margin-bottom:20px}h1{font-size:36px;margin:0 0 14px;letter-spacing:-1px}p{line-height:1.7;color:#a9b8cf;margin:0 0 24px}.servers{display:flex;gap:10px;justify-content:center;margin:30px 0;flex-wrap:wrap}.servers span{padding:9px 14px;border:1px solid #334155;border-radius:9px;color:#cbd5e1;background:#18243a;font-size:13px}
#error{color:#fecaca;background:#3b222b;margin:0;padding:12px 24px;font-size:14px}a{color:#7dd3fc}[hidden]{display:none!important}
@media(max-width:720px){header{gap:10px;padding:12px 16px}.note{display:none}.brand{font-size:20px}h1{font-size:29px}button{font-size:13px}}
</style></head><body>
<header id="launcher-header"><div class="brand"><img src="/icon.svg" alt="">gnvitop</div><span id="status" class="status" role="status">Checking…</span><span class="spacer"></span><span class="note" id="note">Your GPU workspace</span><button id="restart" hidden>Restart</button><button id="toggle" class="start" disabled>Start</button></header>
<div id="error" role="alert" hidden></div>
<main><section id="empty"><img class="symbol" src="/icon.svg" alt=""><h1 id="heading">Your GPU workspace</h1><p id="description" hidden></p><button id="start" class="start" disabled>Start</button><div class="servers">__GROUPS__</div></section><iframe id="dashboard" title="Live GPU dashboard" hidden></iframe></main>
<script nonce="__NONCE__">
const token='__TOKEN__';
const $=id=>document.getElementById(id);
let running=false,busy=false,lastPid=null,requestInFlight=false;
function showError(message){$('error').textContent=message;$('error').hidden=!message;}
function render(state){
 running=state.running;
 $('launcher-header').hidden=state.ready||!running;
 $('status').textContent=state.ready?'Monitoring running':running?'Starting…':'Monitoring stopped';
 $('status').classList.toggle('live',state.ready);
 $('toggle').textContent=running?'Stop':'Start';
 $('toggle').className=running?'stop':'start';
 $('restart').hidden=!running;
 $('note').textContent=''; $('start').hidden=running; $('heading').textContent=running?'Starting…':'Monitoring stopped';
 $('empty').hidden=state.ready;$('dashboard').hidden=!state.ready;
 if(state.ready && lastPid!==state.pid){$('dashboard').src='http://127.0.0.1:5051/';lastPid=state.pid;}
 if(!running){$('dashboard').removeAttribute('src');lastPid=null;$('heading').textContent='Monitoring stopped';}
 for(const id of ['start','toggle','restart'])$(id).disabled=busy;
}
async function poll(){
 if(busy||requestInFlight||document.hidden)return;requestInFlight=true;
 try{const response=await fetch('/control/status',{cache:'no-store'});if(!response.ok)throw Error('The local launcher is unavailable. Reload this page to reconnect.');render(await response.json());showError('');}
 catch(error){showError(error.message);}
 finally{requestInFlight=false;}
}
async function change(action){
 if(busy)return;busy=true;showError('');
 for(const id of ['start','toggle','restart'])$(id).disabled=true;
 $('status').textContent=action==='stop'?'Stopping…':action==='restart'?'Restarting…':'Starting…';
 try{const response=await fetch('/control/'+action,{method:'POST',headers:{'X-Gnvitop-Token':token}});const state=await response.json();if(!response.ok)throw Error(state.error||'Could not change monitoring state.');busy=false;render(state);}
 catch(error){showError(error.message);busy=false;for(const id of ['start','toggle','restart'])$(id).disabled=false;}
}
window.addEventListener('message',event=>{
 if(event.origin!=='http://127.0.0.1:5051'||event.source!==$('dashboard').contentWindow)return;
 if(event.data?.type==='gnvitop-control'&&['stop','restart'].includes(event.data.action))change(event.data.action);
});
$('toggle').addEventListener('click',()=>change(running?'stop':'start'));
$('start').addEventListener('click',()=>change('start'));
$('restart').addEventListener('click',()=>change('restart'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
poll();setInterval(poll,10000);
</script></body></html>
